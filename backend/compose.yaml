services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seops
      POSTGRES_PASSWORD: seops
      POSTGRES_DB: seops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - seops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seops -d seops"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  seops_postgres:
