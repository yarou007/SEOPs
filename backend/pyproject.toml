[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seops-backend"
version = "0.1.0"
description = "SEOPs database and authentication foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "itsdangerous>=2.2,<3",
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-analytics-data>=0.18,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
